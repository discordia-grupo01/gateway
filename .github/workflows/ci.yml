name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Se valida el template, que es lo que se despliega: se renderiza con
      # valores de prueba (como hace kong-config con envsubst) y Kong lo parsea.
      - name: Validar kong.yml.template
        run: |
          sed -E \
            -e 's#\$\{[A-Z_]+_UPSTREAM_URL\}#http://upstream.invalid:8080#g' \
            -e 's#\$\{JWT_SECRET\}#ci-secret#g' \
            -e 's#\$\{WEB_ORIGIN\}#https://web.invalid#g' \
            kong/kong.yml.template > "$RUNNER_TEMP/kong.yml"
          if grep -n '\${' "$RUNNER_TEMP/kong.yml"; then
            echo "::error::El template tiene una variable sin valor de prueba en el CI (arriba). Si es un upstream, que termine en _UPSTREAM_URL."
            exit 1
          fi
          docker run --rm -e KONG_DATABASE=off -v "$RUNNER_TEMP/kong.yml:/kong.yml:ro" kong:3.6 kong config parse /kong.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Oracle por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/gateway
            git pull
            docker compose up -d --force-recreate kong-config gateway caddy
