name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis de kong.yml
        run: |
          docker run --rm -e KONG_DATABASE=off -v $(pwd)/kong/kong.yml:/kong.yml kong:3.6 kong config parse /kong.yml

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy a Oracle por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/gateway
            git pull
            docker compose up -d --force-recreate kong-config gateway caddy
