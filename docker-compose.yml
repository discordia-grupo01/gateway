services:
  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${GATEWAY_PORT:-8000}:8000"              # entrada real de la API
      - "127.0.0.1:${GATEWAY_ADMIN_PORT:-8001}:8001" 
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
