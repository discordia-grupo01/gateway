name: discordia-gateway

services:
  kong-config:
    image: alpine:3.19
    environment:
      JWT_SECRET: ${JWT_SECRET:-secreto-jwt-solo-local}
      IDENTITY_UPSTREAM_URL: ${IDENTITY_UPSTREAM_URL:-http://host.docker.internal:8080}
      SERVERS_UPSTREAM_URL: ${SERVERS_UPSTREAM_URL:-http://host.docker.internal:8081}
      MESSAGING_UPSTREAM_URL: ${MESSAGING_UPSTREAM_URL:-http://host.docker.internal:4000}
      NOTIFICATIONS_UPSTREAM_URL: ${NOTIFICATIONS_UPSTREAM_URL:-http://host.docker.internal:4001}
      VOICE_UPSTREAM_URL: ${VOICE_UPSTREAM_URL:-http://host.docker.internal:4002}
      ADMIN_UPSTREAM_URL: ${ADMIN_UPSTREAM_URL:-http://host.docker.internal:8082}
      METRICS_UPSTREAM_URL: ${METRICS_UPSTREAM_URL:-http://host.docker.internal:8083}
      # Mientras billing no tenga su VM, una URL de relleno deja arrancar a
      # Kong; sus rutas responden 502 hasta que se configure.
      BILLING_UPSTREAM_URL: ${BILLING_UPSTREAM_URL:-http://host.docker.internal:8084}
      # Unico origen que puede subir adjuntos directo desde el navegador. Sin
      # configurar, Kong arranca igual y solo falla esa subida desde la web.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Trazas hacia New Relic. Sin endpoint y api-key, Kong arranca igual y no
      # exporta nada (ver kong/render.sh).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kong}
      LOG_SHIP_URL: ${LOG_SHIP_URL:-}
      LOG_SHIP_API_KEY: ${LOG_SHIP_API_KEY:-}
    volumes:
      - ./kong:/template:ro
      - kong_rendered:/rendered
    command: sh /template/render.sh

  gateway:
    image: kong:3.6
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      # Los errores del nucleo de Kong (404 sin ruta, 502/503/504) salen siempre
      # en JSON, nunca en texto plano ni HTML; el plugin post-function los lleva
      # al formato unificado.
      KONG_ERROR_DEFAULT_TYPE: application/json
      KONG_TRACING_INSTRUMENTATIONS: request
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Kong toma worker_connections del limite de archivos abiertos (1024 por
    # defecto). Cada WebSocket usa dos conexiones (cliente y messaging), asi
    # que con 1024 un worker no pasaba de ~500 sockets y cortaba los nuevos.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:8000:8000"
    volumes:
      - kong_rendered:/kong
    depends_on:
      kong-config:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway

volumes:
  kong_rendered:
  caddy_data:
  caddy_config:
